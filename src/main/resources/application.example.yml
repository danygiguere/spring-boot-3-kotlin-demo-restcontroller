spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:demo_spring_kotlin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:demo_spring_kotlin}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8083}
